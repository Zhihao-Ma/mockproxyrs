[workspace]
members = [
    "core",
    "desktop/src-tauri",
    "server",
]

[workspace.dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
rustls = "0.22"
tokio-rustls = "0.25"

anyhow = "1.0.81"
bytes = "1.6.0"
futures = "0.3.30"
http-body-util = "0.1.1"
hyper = { version = "1.5.2", features = ["full"] }
hyper-util = { version = "0.1.3", features = ["full"] }
openssl = "0.10.64"
tokio = { version = "1.37.0", features = ["full"] }
tokio-openssl = "0.6.4"
futures-util = "0.3.30"
tokio-util = "0.7.10"
serde = "1.0.217"
serde_json = "1.0.137"
hyper-tls = "0.6.0"
native-tls = "0.2.12"
tokio-native-tls = "0.3.1"
flate2 = "1.0"
#serde
serde_yaml = "0.8"
getset = "0.1.2"
#对象存储
state = { version = "0.5", features = ["tls"] }
#log
log = "0.4"
fast_log = { version="1.5.1", features = ["lz4", "zip", "gzip"] }

rusqlite = { version = "0.31.0", features = ["bundled"] }
r2d2 = "0.8.10"
r2d2_sqlite = "0.24.0"
rusqlite_migration = "1.0.2"
lazy_static = "1.4.0"
include_dir = "0.7.3"
uuid = { version = "1.8.0", features = ["v4", "serde"] }
regex = "1.11.1"
thiserror = "2.0"
async-trait = "0.1"

# JS 脚本引擎
rquickjs = "0.12.0"


