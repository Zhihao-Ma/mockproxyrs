name: Release App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop"
          cache-on-failure: true

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev build-essential libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install web frontend deps
        run: npm ci
        working-directory: web

      - name: Install desktop deps
        run: npm ci
        working-directory: desktop

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "desktop"
          tagName: ${{ github.ref_name }}
          releaseName: "MockProxyRS ${{ github.ref_name }}"
          releaseBody: |
            ## MockProxyRS ${{ github.ref_name }}

            ### 安装说明
            - **Windows**: 下载 `.msi` 或 `.exe` 安装包
            - **macOS**: 下载 `.dmg` 或 `.app.tar.gz`
            - **Linux**: 下载 `.deb` 或 `.AppImage`

            ### 变更内容
            请查看提交历史了解详细变更。
          releaseDraft: false
          prerelease: false
          includeDebug: false
