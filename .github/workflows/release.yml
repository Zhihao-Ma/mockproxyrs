name: Release App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop"
          cache-on-failure: true

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install web frontend deps
        run: npm ci
        working-directory: web

      - name: Install desktop deps
        run: npm ci
        working-directory: desktop

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "desktop"
          tagName: ${{ github.ref_name }}
          releaseName: "MockProxyRS ${{ github.ref_name }}"
          releaseBody: |
            ## MockProxyRS ${{ github.ref_name }}

            ### 安装说明 / Installation
            - **Windows**: 下载 `.msi` 或 `.exe` 安装包 / Download the `.msi` or `.exe` installer
            - **macOS**: 下载 `.dmg` 或 `.app.tar.gz` / Download the `.dmg` or `.app.tar.gz`
            - **Linux**: 下载 `.deb` 或 `.AppImage` / Download the `.deb` or `.AppImage`

            ### 变更内容 / Changes

            **规则管理 / Rule Management**
            - 规则卡片支持折叠/展开，收起态精简展示（仅启用状态 + URL）
              Rule cards can be collapsed/expanded; collapsed view shows only enabled state and URL
            - 新增左侧规则导航侧边栏，按启用状态着色，点击定位到对应规则
              New left-hand rule navigation sidebar, color-coded by enabled state, click to jump to a rule
            - 支持全部展开/收起与全部启用/禁用
              Added expand/collapse-all and enable/disable-all controls
            - 规则按创建时间倒序排列（新增置顶）
              Rules are ordered newest-first by creation time

            **编辑器 / Editor**
            - JSON 与 JS 脚本编辑器升级为 CodeMirror 6，支持花括号/函数体折叠
              JSON and JS editors upgraded to CodeMirror 6 with brace/function folding

            **网络监控 / Network Monitoring**
            - 响应体 JSON 自动格式化展示
              JSON response bodies are auto-formatted
            - 请求详情新增请求头、响应头与 Payload 展示
              Request detail now shows request headers, response headers, and payload

            **桌面 / Desktop**
            - 默认窗口宽度调整为 1000px
              Default window width increased to 1000px
          releaseDraft: false
          prerelease: false
          includeDebug: false
