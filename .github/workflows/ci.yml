name: CI Check

on:
  push:
    branches: [ test ]
  pull_request:
    branches: [ test ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 安装 Node.js（适配你的项目：前端在 web/）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json  # 🔴 修改：指定前端依赖锁文件路径

      # 安装 Rust
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # 缓存 Rust 依赖
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      # 安装 Tauri 系统依赖
      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install tauri deps
        run: cd web && npm install

      # 🔴 修改：安装前端依赖（在 web/ 目录下）
      - name: Install frontend deps
        run: cd desktop && npm install

      # 🔴 修改：TypeScript 类型检查（在 web/ 目录下）
      - name: Type check
        run: cd web && npx tsc --noEmit

      # Rust 代码格式化检查
      - name: Rust fmt
        run: cargo fmt --all --check

      # Rust 语法检查
      - name: Rust clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Rust 单元测试
      - name: Rust test
        run: cargo test

      # 🔴 修改：Tauri 构建验证（在 desktop/ 目录下）
      - name: Tauri build check
        run: cd desktop && npm run build -- --bundles none
